[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "underwater_surveillance"
version = "1.0.0"
authors = [
  { name="Hemamdhar Dakarapu" },
]
description = "Production Software Package for AI-Based Underwater Visual Surveillance"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "opencv-python>=4.7.0",
    "pillow>=9.0.0",
    "torch>=1.13.0",
    "ultralytics>=8.0.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
]

[project.scripts]
underwater-surveillance = "underwater_surveillance.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "underwater_surveillance"
version = "1.0.0"
description = "AI-Based Underwater Visual Surveillance Pipeline"
authors = [{name = "Hemamdhar Dakarapu"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "ultralytics>=8.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0"
]

[project.scripts]
underwater-surveillance = "underwater_surveillance.cli:main"
